    <!--
      The AdSense base script is intentionally NOT loaded here. Loading it
      unconditionally on every page means Google's Auto/Anchor ads can be
      injected on routes that are meant to be completely ad-free (Pupil

      loaded dynamically, only on ad-eligible routes, by
      src/components/AdsenseLoader.tsx.
    -->

    <meta
      name="description"
      content="Five free SEMH assessment tools that run entirely in your browser. Complete a checklist and download the results as a CSV spreadsheet. No account, no data sent anywhere."
    />
